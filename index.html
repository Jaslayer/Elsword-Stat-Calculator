<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>裝備配置計算機Ver2.0</title>
    <meta
      name="description"
      content="A basic GitHub Pages site starter."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="page-header">
      <h1 class="page-title">裝備配置計算機<span class="version">Ver2.0</span></h1>
    </header>
    <main class="container" aria-label="Main panel">
      <aside class="sidebar">
        <nav class="stat-list" aria-label="Statistics list">
          <button class="stat-item" data-description="">物/魔攻擊力</button>
          <button class="stat-item" data-description="">(超)適應力</button>
          <button class="stat-item" data-description="">致命一擊傷害</button>
          <button class="stat-item" data-description="">兩極化</button>
          <button class="stat-item" data-description="">Boss 傷害</button>
          <button class="stat-item" data-description="">50%以上/以下</button>
          <button class="stat-item" data-description="">100%以下</button>
          <button class="stat-item" data-description="">流血</button>
          <button class="stat-item" data-description="">強烈/超越技傷</button>
          <button class="stat-item" data-description="">所有技傷</button>
          <button class="stat-item" data-description="">其他</button>
        </nav>
        <div class="calc-panel" id="calcPanel">
          <div class="input-items-wrapper">
            <div class="input-panel-header">
              <div class="panel-header-row">
                <div class="panel-label"></div>
                <div class="config-wrapper">
                  <div style="color: rgba(255, 255, 255, 0.7); text-align: center; width: 100px;">配置 1</div>
                </div>
                <div class="config-wrapper">
                  <div style="color: rgba(255, 255, 255, 0.7); text-align: center; width: 100px;">配置 2</div>
                </div>
                <div class="config-wrapper" style="flex-direction: column;">
                  <div style="display: flex; align-items: center; justify-content: center; gap: 10px; line-height: 1; height: 24px;">
                    <div class="arrow-left" style="font-size: 20px; color: #ffffff; cursor: default; width: 20px; text-align: center; line-height: 1;">▲</div>
                    <div style="color: rgba(255, 255, 255, 0.7); text-align: center; width: 50px; line-height: 1;">變動量</div>
                  </div>
                  <div class="config-ratio-value" style="color: rgba(255, 255, 255, 0.9); text-align: center; margin-bottom: 4px; font-weight: 600;">-</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </aside>
      <section class="content" aria-label="Content area">
        <div class="description-panel" id="descriptionPanel">
          <p>群母上的风桌選手</p>
        </div>
      </section>
    </main>
    <script>
      // 浮點數精度處理函數 - 避免 5.3 顯示成 5.3000000002 或 5.29999999
      const roundNumber = (num, decimals = 5) => {
        if (!Number.isFinite(num)) return num;
        // 用字符串求提保有意義的小數位數
        const multiplier = Math.pow(10, decimals);
        const rounded = Math.round(num * multiplier) / multiplier;
        // 如果結果是整數，返回整數；否則返回精確的浮點數
        return parseFloat(rounded.toFixed(decimals).replace(/\.?0+$/, ''));
      };

      /**
       * 統一接口：所有 input/click/spinner 事件都通過此函數處理
       * 流程: 更新 element 值 → 調用 calc.js 更新 UserInputData → 回到 index.html 更新顯示
       * @param {Element} element - 改變的輸入元素
       * @param {number} newValue - 新值（可選，如果不提供則從 element 讀取）
       */
      function syncStatUpdate(element, newValue) {
        if (!element) return;

        // 找到所屬的面板
        const panelDiv = element.closest('.input-panel-item');
        if (!panelDiv) return;

        // Step 1: 更新 element 的值
        const getInputValue = (el) => {
          const value = window.computeInputValue ? window.computeInputValue(el) : 0;
          return roundNumber(value);
        };

        const setInputValue = (el, val) => {
          const precisedValue = roundNumber(val);
          if (el.classList.contains('button-input')) {
            if (el.dataset.value && el.dataset.value.includes('|')) {
              const parts = el.dataset.value.split('|');
              if (parts.length >= 3) {
                el.dataset.value = `${precisedValue}|${parts[1]}|${parts[2]}`;
              } else if (parts.length === 2) {
                el.dataset.value = `${precisedValue}|${parts[1]}`;
              } else {
                el.dataset.value = precisedValue;
              }
            } else {
              el.dataset.value = precisedValue;
            }
            const displayValue = getInputValue(el);
            el.textContent = displayValue === 0 ? '' : displayValue;
          } else {
            el.value = precisedValue;
          }
        };

        if (newValue !== undefined) {
          setInputValue(element, newValue);
        }

        // Step 2: 調用 calc.js 的函數更新 UserInputData
        if (window.updateUserDataFromElement && typeof window.updateUserDataFromElement === 'function') {
          window.updateUserDataFromElement(element);
        }

        // Step 3: 回到 index.html 更新顯示
        // 觸發三向綁定更新
        if (panelDiv.triggerThreeWayBinding && element.classList.contains('button-input')) {
          panelDiv.triggerThreeWayBinding(element);
        } else if (!element.classList.contains('button-input')) {
          // 常規輸入框也需要更新三向綁定
          const leftInput = panelDiv.querySelector('.left-input');
          const resultInput = panelDiv.querySelector('.result-input');
          const middleInput = panelDiv.querySelector('.middle-input');
          if (leftInput && resultInput && middleInput) {
            const leftVal = getInputValue(leftInput);
            const resultVal = getInputValue(resultInput);
            middleInput.value = roundNumber(resultVal - leftVal);
          }
        }

        // 更新產品顯示
        if (window.updateProductDisplay && typeof window.updateProductDisplay === 'function') {
          window.updateProductDisplay();
        }
      }

      /**
       * 主幹函數：統一管理整個統計項目更新流程（向後相容）
       * @param {Element} changedElement - 改變的輸入元素
       */
      function triggerFullStatUpdate(changedElement) {
        syncStatUpdate(changedElement);
      }

      // 導出統一接口函數到 window 對象
      window.syncStatUpdate = syncStatUpdate;

      const statItems = document.querySelectorAll('.stat-item');
      const STORAGE_KEY = 'selectedGameStats';
      
      // 初始化遊戲數值狀態陣列，每個位置對應一個數值是否被選中
      // 優先從 localStorage 讀取，如果沒有則初始化為 false
      let selectedGameStats = localStorage.getItem(STORAGE_KEY)
        ? JSON.parse(localStorage.getItem(STORAGE_KEY))
        : new Array(statItems.length).fill(false);

      const descriptionPanel = document.getElementById('descriptionPanel');
      const descriptionText = descriptionPanel.querySelector('p');


      // 根據保存的狀態恢復按鈕的視覺狀態
      statItems.forEach((item, index) => {
        if (selectedGameStats[index]) {
          item.classList.add('selected');
        }
      });

      statItems.forEach(item => {
        item.addEventListener('mouseenter', (e) => {
          const description = e.target.getAttribute('data-description');
          
          // 如果 data-description 為空，則不開啟懸浮視窗
          if (!description) {
            return;
          }
          
          descriptionText.textContent = description;
          
          const rect = e.target.getBoundingClientRect();
          const containerRect = document.querySelector('.container').getBoundingClientRect();
          const panelLeft = rect.right - containerRect.left + 5;
          const panelTop = rect.top - containerRect.top + rect.height / 2 - descriptionPanel.offsetHeight / 2;
          
          descriptionPanel.style.left = panelLeft + 'px';
          descriptionPanel.style.top = panelTop + 'px';
          descriptionPanel.classList.add('show');
        });

        item.addEventListener('mouseleave', () => {
          descriptionPanel.classList.remove('show');
        });

        item.addEventListener('click', (e) => {
          const itemIndex = Array.from(statItems).indexOf(e.target);
          
          // Toggle selected 狀態
          e.target.classList.toggle('selected');
          
          // 移除焦點，使按鈕立即回復到正常樣式
          e.target.blur();
          
          // 更新遊戲數值選取狀態陣列
          selectedGameStats[itemIndex] = !selectedGameStats[itemIndex];
          
          // 保存到 localStorage
          localStorage.setItem(STORAGE_KEY, JSON.stringify(selectedGameStats));
          
          // 更新輸入面板
          updateInputPanel();
        });
      });

      // =============== 常量定義 ===============
      const MAX_ADAPTABILITY_PANEL = 60; // 適應力面板最大值

      // 增刪 Input Panel
      function updateInputPanel() {
        const calcPanel = document.getElementById('calcPanel');
        let wrapper = calcPanel.querySelector('.input-items-wrapper');
        
        // 獲取應該存在的 stat-item 索引
        const shouldExistIndices = [];
        statItems.forEach((item, index) => {
          if (selectedGameStats[index]) {
            shouldExistIndices.push(index);
          }
        });
        
        // 獲取當前存在的 panel 索引
        const currentPanels = wrapper.querySelectorAll('.input-panel-item');
        const currentIndices = Array.from(currentPanels).map(panel => parseInt(panel.dataset.index));
        
        // 判斷是要添加還是刪除
        const toAdd = shouldExistIndices.filter(index => !currentIndices.includes(index));
        const toRemove = currentIndices.filter(index => !shouldExistIndices.includes(index));
        
        if (toRemove.length > 0) {
          // 刪除模式：先縮小 calc-panel，再刪除 panels
          // 添加 removing 類開始刪除動畫
          toRemove.forEach((index) => {
            const panel = wrapper.querySelector(`[data-index="${index}"]`);
            if (panel) {
              panel.classList.add('removing');
            }
          });
          
          // 計算新的高度（排除要刪除的 panels）並縮小 calc-panel
          updatePanelHeight(toRemove);
          
          // 等待收縮動畫完成後刪除 panels
          setTimeout(() => {
            toRemove.forEach((index) => {
              const panel = wrapper.querySelector(`[data-index="${index}"]`);
              if (panel) {
                panel.remove();
              }
            });
            // 重新排列剩餘的 panels
            reorderPanels(shouldExistIndices, wrapper);
            // 更新乘積顯示
            if (window.updateProductDisplay) {
              window.updateProductDisplay();
            }
          }, 350);
        } else if (toAdd.length > 0) {
          // 添加模式：先添加 panels，展開 calc-panel，再顯示動畫
          // 先添加新的 panels
          toAdd.forEach((index) => {
            const statItem = statItems[index];
            createInputPanel(statItem, index, wrapper, true); // 傳入 true 表示新增
          });
          
          // 重新排列
          reorderPanels(shouldExistIndices, wrapper);
          
          // 先計算新的高度並展開 calc-panel
          setTimeout(() => {
            updatePanelHeight();
            // 更新乘積顯示
            if (window.updateProductDisplay) {
              window.updateProductDisplay();
            }
          }, 50);
        } else {
          // 只有排序變化
          reorderPanels(shouldExistIndices, wrapper);
          // 更新乘積顯示
          if (window.updateProductDisplay) {
            window.updateProductDisplay();
          }
        }
      }
      
      // 重新排列 panels 的函數
      function reorderPanels(shouldExistIndices, wrapper) {
        const headerPanel = wrapper.querySelector('.input-panel-header');
        const allPanels = Array.from(wrapper.querySelectorAll('.input-panel-item'));
        allPanels.forEach((panel) => {
          const panelIndex = parseInt(panel.dataset.index);
          
          // 只排序在 shouldExistIndices 中的 panels
          if (!shouldExistIndices.includes(panelIndex)) {
            return;
          }
          
          const targetPosition = shouldExistIndices.indexOf(panelIndex);
          // targetPosition 是相對於 panels 的位置，但在 wrapper 中要加 1（因為 header 在第 0 位）
          const targetPositionInWrapper = targetPosition + 1;
          const currentPosition = Array.from(wrapper.children).indexOf(panel);
          
          // 如果位置不正確，添加動畫類並移動到正確位置
          if (currentPosition !== targetPositionInWrapper) {
            // 添加重排序動畫類
            panel.classList.add('reordering');
            
            // 計算目標元素（確保 header 始終在最前）
            const targetElement = Array.from(wrapper.children)[targetPositionInWrapper];
            if (targetElement) {
              wrapper.insertBefore(panel, targetElement);
            } else {
              wrapper.appendChild(panel);
            }
            
            // 動畫完成後移除類
            setTimeout(() => {
              panel.classList.remove('reordering');
            }, 350);
          }
        });
      }
      
      // 更新 calc-panel 的高度
      // excludeIndices: 要排除的 panel 索引陣列（用於刪除時計算新高度）
      function updatePanelHeight(excludeIndices = []) {
        const calcPanel = document.getElementById('calcPanel');
        const wrapper = calcPanel.querySelector('.input-items-wrapper');
        
        if (!wrapper) {
          return;
        }
        
        // 使用多次 requestAnimationFrame 確保布局穩定後再計算
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            // 先隱藏要排除的 panels
            excludeIndices.forEach(index => {
              const panel = wrapper.querySelector(`[data-index="${index}"]`);
              if (panel) {
                panel.style.display = 'none';
              }
            });
            
            // 等待隱藏生效後再計算高度
            requestAnimationFrame(() => {
              const visiblePanels = Array.from(wrapper.querySelectorAll('.input-panel-item')).filter(panel => {
                return panel.style.display !== 'none';
              });
              
              const headerHeight = wrapper.querySelector('.input-panel-header')?.scrollHeight || 0;
              
              if (visiblePanels.length === 0) {
                // 沒有 input-panel-item，但仍需要 header 的高度
                const styles = window.getComputedStyle(calcPanel);
                const paddingTop = parseFloat(styles.paddingTop) || 0;
                const paddingBottom = parseFloat(styles.paddingBottom) || 0;
                const totalHeight = headerHeight + paddingTop + paddingBottom;
                calcPanel.style.height = totalHeight + 'px';
              } else {
                // 直接使用 wrapper 的 scrollHeight（包括所有可見內容和 gap）
                const wrapperHeight = wrapper.scrollHeight;
                const styles = window.getComputedStyle(calcPanel);
                const paddingTop = parseFloat(styles.paddingTop) || 0;
                const paddingBottom = parseFloat(styles.paddingBottom) || 0;
                const totalHeight = wrapperHeight + paddingTop + paddingBottom;
                
                calcPanel.style.height = totalHeight + 'px';
              }
              
              // 還原隱藏
              excludeIndices.forEach(index => {
                const panel = wrapper.querySelector(`[data-index="${index}"]`);
                if (panel) {
                  panel.style.display = '';
                }
              });
            });
          });
        });
      }

      // 為每個被選中的 stat-item 創建一個 input-panel
      function createInputPanel(statItem, index, container, isNewItem = false) {
        const panelDiv = document.createElement('div');
        panelDiv.className = 'input-panel-item';
        if (isNewItem) {
          panelDiv.classList.add('entering');
        }
        panelDiv.dataset.index = index;
        
        // 判斷是否需要按鈕型輸入框的 stat-item
        const buttonInputIndices = [0, 1, 2, 4, 5, 10];
        const useButtonInput = buttonInputIndices.includes(index);
        
        if (useButtonInput) {
          // 按鈕型輸入框
          panelDiv.innerHTML = `
            <button class="delete-panel-btn-inline" data-index="${index}">×</button>
            <div class="panel-row">
              <div class="panel-label">${statItem.textContent}</div>
              <div class="config-wrapper">
                <label for="stat-${index}-left" class="sr-only">配置 1</label>
                <button class="button-input left-input" id="stat-${index}-left" data-index="${index}" data-type="left" data-value="${index === 1 ? '0|0|0|0|95' : (index === 2 ? '0||' : '0')}" data-min="0"></button>
                <div class="input-spinner">
                  <button class="spinner-btn up" data-type="left" data-index="${index}">∧</button>
                  <button class="spinner-btn down" data-type="left" data-index="${index}">∨</button>
                </div>
              </div>
              <div class="config-wrapper">
                <label for="stat-${index}-result" class="sr-only">配置 2</label>
                <button class="button-input result-input" id="stat-${index}-result" data-index="${index}" data-type="result" data-value="${index === 1 ? '0|0|0|0|95' : (index === 2 ? '0||' : '0')}" data-min="0"></button>
                <div class="input-spinner">
                  <button class="spinner-btn up" data-type="result" data-index="${index}">∧</button>
                  <button class="spinner-btn down" data-type="result" data-index="${index}">∨</button>
                </div>
              </div>
              <div class="config-wrapper">
                <span class="middle-indicator">▲</span>
                <label for="stat-${index}-middle" class="sr-only">變動量</label>
                <input type="number" class="stat-input short-input middle-input" data-index="${index}" id="stat-${index}-middle" name="stat-${index}-middle" disabled />
              </div>
            </div>
          `;
        } else {
          // 常規輸入框
          panelDiv.innerHTML = `
            <button class="delete-panel-btn-inline" data-index="${index}">×</button>
            <div class="panel-row">
              <div class="panel-label">${statItem.textContent}</div>
              <div class="config-wrapper">
                <label for="stat-${index}-left" class="sr-only">配置 1</label>
                <input type="number" class="stat-input short-input left-input" data-index="${index}" min="0" id="stat-${index}-left" name="stat-${index}-left" />
                <div class="input-spinner">
                  <button class="spinner-btn up" data-type="left" data-index="${index}">∧</button>
                  <button class="spinner-btn down" data-type="left" data-index="${index}">∨</button>
                </div>
              </div>
              <div class="config-wrapper">
                <label for="stat-${index}-result" class="sr-only">配置 2</label>
                <input type="number" class="stat-input short-input result-input" data-index="${index}" min="0" id="stat-${index}-result" name="stat-${index}-result" />
                <div class="input-spinner">
                  <button class="spinner-btn up" data-type="result" data-index="${index}">∧</button>
                  <button class="spinner-btn down" data-type="result" data-index="${index}">∨</button>
                </div>
              </div>
              <div class="config-wrapper">
                <span class="middle-indicator">▲</span>
                <label for="stat-${index}-middle" class="sr-only">變動量</label>
                <input type="number" class="stat-input short-input middle-input" data-index="${index}" id="stat-${index}-middle" name="stat-${index}-middle" disabled />
              </div>
            </div>
          `;
        }
        
        // 确保删除按钮元素存在
        const deleteBtn = panelDiv.querySelector('.delete-panel-btn-inline');
        
        // 绑定 panel 的 hover 事件，显示隐藏删除按钮
        panelDiv.addEventListener('mouseenter', () => {
          deleteBtn.classList.add('show');
        });
        
        panelDiv.addEventListener('mouseleave', () => {
          deleteBtn.classList.remove('show');
        });
        
        // 绑定删除按钮的点击事件
        deleteBtn.addEventListener('click', () => {
          statItems[index].classList.remove('selected');
          selectedGameStats[index] = false;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(selectedGameStats));
          updateInputPanel();
        });
        
        container.appendChild(panelDiv);
        
        // 動畫完成後移除 entering 類
        if (isNewItem) {
          setTimeout(() => {
            panelDiv.classList.remove('entering');
          }, 400);
        }
        
        // 綁定計算事件 - 三向绑定逻辑
        const leftInput = panelDiv.querySelector('.left-input');
        const middleInput = panelDiv.querySelector('.middle-input');
        const resultInput = panelDiv.querySelector('.result-input');
        const middleIndicator = panelDiv.querySelector('.middle-indicator');
        
        // 獲取輸入值的輔助函數 - 直接調用 calc.js 的 computeInputValue（已統一集中計算邏輯）
        const getInputValue = (element) => {
          const value = window.computeInputValue ? window.computeInputValue(element) : 0;
          return roundNumber(value);
        };
        
        // 設置 button-input 或 inputbox - 支持 "panel|..." 格式（限制邏輯由 calc.js 統一處理）
        const setInputValue = (element, value) => {
          const precisedValue = roundNumber(value);
          if (element.classList.contains('button-input')) {
            // 對於按鈕型輸入（含有 | 符號），保留其他部分，只更新 panel 值
            if (element.dataset.value && element.dataset.value.includes('|')) {
              const parts = element.dataset.value.split('|');
              // 直接更新 panel 值，限制邏輯由 computeInputValue() 和 calculateAdaptabilityValue() 統一處理
              if (parts.length >= 3) {
                element.dataset.value = `${precisedValue}|${parts[1]}|${parts[2]}`;
              } else if (parts.length === 2) {
                element.dataset.value = `${precisedValue}|${parts[1]}`;
              } else {
                element.dataset.value = precisedValue;
              }
            } else {
              element.dataset.value = precisedValue;
            }
            // 重新計算顯示值，調用 getInputValue 以確保正確的計算
            const displayValue = getInputValue(element);
            element.textContent = displayValue === 0 ? '' : displayValue;
          } else {
            element.value = precisedValue;
          }
        };
        
        // 更新中間指示器
        const updateMiddleIndicator = () => {
          const middleValue = roundNumber(parseFloat(middleInput.value) || 0);
          middleIndicator.classList.remove('positive', 'negative', 'zero');
          middleIndicator.textContent = '▲';
          if (middleValue > 0) {
            middleIndicator.classList.add('positive');
          } else if (middleValue < 0) {
            middleIndicator.classList.add('negative');
          } else {
            middleIndicator.classList.add('zero');
          }
        };
        
        // 觸發三向綁定更新的函數
        const triggerThreeWayBinding = (changedInput) => {
          const leftValue = getInputValue(leftInput);
          const resultValue = getInputValue(resultInput);
          
          const newMiddle = roundNumber(resultValue - leftValue);
          middleInput.value = newMiddle;
          
          updateMiddleIndicator();
          
          // 立即触发按钮的 change 事件，使计算系统更新显示
          resultInput.dispatchEvent(new Event('change', { bubbles: true }));
          
          // 更新乘積顯示
          if (window.updateProductDisplay) {
            window.updateProductDisplay();
          }
        };
        
        // 為按鈕型輸入框添加事件處理
        if (useButtonInput) {
          const leftBtn = panelDiv.querySelector('.left-input');
          const resultBtn = panelDiv.querySelector('.result-input');
          
          // 將三向綁定函數存儲在 panelDiv 上，供對話框使用
          panelDiv.triggerThreeWayBinding = triggerThreeWayBinding;
          panelDiv.getInputValue = getInputValue;
          panelDiv.setInputValue = setInputValue;
          panelDiv.leftInput = leftInput;
          panelDiv.resultInput = resultInput;
          panelDiv.middleInput = middleInput;
          
          leftBtn.addEventListener('click', () => {
            openNumberInputDialog(leftBtn, 'left', index, panelDiv);
          });
          
          resultBtn.addEventListener('click', () => {
            openNumberInputDialog(resultBtn, 'result', index, panelDiv);
          });
        }
        
        // 配置1 改變 → 變動量 = 配置2 - 配置1
        if (leftInput.classList.contains('button-input')) {
          // 按鈕型輸入框不需要綁定 input 事件
        } else {
          leftInput.addEventListener('input', () => {
            syncStatUpdate(leftInput);
          });
        }
        
        // 配置2 改變 → 變動量 = 配置2 - 配置1
        if (resultInput.classList.contains('button-input')) {
          // 按鈕型輸入框不需要綁定 input 事件
        } else {
          resultInput.addEventListener('input', () => {
            syncStatUpdate(resultInput);
          });
        }
        
        // 變動量已禁用 - 不需要輸入事件監聽

        // 绑定所有 spinner 按钮
        const spinnerBtns = panelDiv.querySelectorAll('.spinner-btn');
        spinnerBtns.forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            const dataType = btn.getAttribute('data-type');
            const isUp = btn.classList.contains('up');
            const increment = isUp ? 1 : -1;
            
            let inputElement;
            if (dataType === 'left') {
              inputElement = leftInput;
            } else if (dataType === 'result') {
              inputElement = resultInput;
            }
            
            if (inputElement) {
              if (inputElement.classList.contains('button-input')) {
                // 按鈕型輸入框：打開對話框，傳入 spinnerIncrement
                if (SPECIAL_DIALOGS[index]) {
                  openSpecialDialog(inputElement, dataType, index, panelDiv, SPECIAL_DIALOGS[index], increment);
                }
              } else {
                // 常規輸入框：直接改值
                const currentValue = parseFloat(inputElement.value) || 0;
                const newValue = roundNumber(currentValue + increment);
                inputElement.value = newValue;
                syncStatUpdate(inputElement);
              }
            }
          });
        });
        
        // 初始化指示器
        updateMiddleIndicator();
      }
      
      // =============== 通用對話框配置工廠函數 ===============
      // 為簡單的數字項目生成統一配置
      function createSimpleNumberConfig(statIndex, statName) {

        };

      // =============== 特殊對話框配置 (可擴展框架) ===============
      const SPECIAL_DIALOGS = {

        0: createSimpleNumberConfig(0, '物/魔攻擊力'),

            };
          },
          serialize: (values) => `${values.panel}|${values.gathering_place ? '1' : '0'}|${values.adapt_potion ? '1' : '0'}|${values.super_adapt}|${values.preset}`,
          getDisplayValue: (values) => {
            // 調用 calc.js 中的計算函數
            return calculateAdaptabilityValue(values).toString();
          }
        },
        
        2: { // 致命一擊傷害 (Critical Damage) - 多字段配置（支持動態加算/乘算）
          type: 'critical-damage',
          dialogId: 'criticalDamageInputDialog',
          fields: [
            {
              name: 'panel',
              type: 'number',
              label: '面板',
              className: 'critical-damage-panel-input',
              minValue: 0
            }
          ],
          separator: '|',
          displayField: 'panel', // 顯示在按鈕上的字段
          parse: (value) => {
            const parts = value ? value.split('|') : [];
            const panel = parseFloat(parts[0]) || 0;
            // 解析加算爆傷 (CSV 格式)
            const additiveDamages = parts[1] ? parts[1].split(',').map(v => {
              const num = parseFloat(v);
              return Number.isNaN(num) ? 0 : num;
            }).filter(v => v !== 0 || parts[1].includes('0')) : [];
            // 解析乘算爆傷 (CSV 格式)
            const multiplicativeDamages = parts[2] ? parts[2].split(',').map(v => {
              const num = parseFloat(v);
              return Number.isNaN(num) ? 1 : num;
            }).filter(v => v !== 0 && !Number.isNaN(v)) : [];
            
            return {
              panel,
              additive_damages: additiveDamages.length > 0 ? additiveDamages : [0],
              multiplicative_damages: multiplicativeDamages.length > 0 ? multiplicativeDamages : [0]
            };
          },
          serialize: (values) => {
            const additivesStr = (values.additive_damages || [0]).filter(v => v !== undefined).join(',');
            const multiplicativesStr = (values.multiplicative_damages || [0]).filter(v => v !== undefined).join(',');
            return `${values.panel}|${additivesStr}|${multiplicativesStr}`;
          },
          getDisplayValue: (values) => {
            // 使用 calc.js 中的獨立計算函數
            return (window.calculateCriticalDamageValue ? window.calculateCriticalDamageValue(values) : 0).toString();

        },

        4: createSimpleNumberConfig(4, 'Boss 傷害'),
        
        // 5: 50%以上/以下
        5: createSimpleNumberConfig(5, '50%以上/以下'),
        
        // 10: 其他
        10: createSimpleNumberConfig(10, '其他')
      };

      // =============== 致命一擊傷害輔助函數 ===============
      
      // 對話框內 spinner 改值（實時改變輸入框的值）
      function handleDialogSpinnerChange(element, field, increment, handleInputChange) {
        const currentValue = parseFloat(element.value) || 0;
        const minValue = field.minValue !== undefined ? field.minValue : Number.NEGATIVE_INFINITY;
        const maxValue = field.maxValue !== undefined ? field.maxValue : Number.POSITIVE_INFINITY;
        let newValue = currentValue + increment;
        // 限制在 minValue 和 maxValue 之間
        newValue = Math.max(minValue, Math.min(maxValue, newValue));
        element.value = newValue;
        element.dispatchEvent(new Event('change', { bubbles: true }));
      }
      
      // 生成加算爆傷行 HTML
      function generateAdditivesHTML(currentValues) {
        let html = '';
        currentValues.additive_damages.forEach((value, addIndex) => {
          if (value === undefined) return;
          html += `
            <div class="dialog-dynamic-row" data-add-index="${addIndex}">
              <input type="number" class="dialog-input dialog-additive-input" id="dialog-additive-${addIndex}" data-index="${addIndex}" value="${value || ''}" placeholder="" style="flex: 1;" />
              <select class="dialog-preset-select dialog-additive-preset" id="dialog-additive-preset-${addIndex}" data-index="${addIndex}" style="flex-shrink: 0; width: 200px;">
                <option value="custom" selected>自訂</option>
              </select>
              <button class="dialog-delete-btn" type="button" data-index="${addIndex}" aria-label="刪除">−</button>
            </div>
          `;
        });
        return html;
      }
      
      // 生成乘算爆傷行 HTML
      function generateMultiplicativesHTML(currentValues, presets) {
        let html = '';
        currentValues.multiplicative_damages.forEach((value, mulIndex) => {
          if (value === undefined) return;
          const presetOptions = presets.map(preset => 
            `<option value="${preset.value}" ${Math.abs(preset.value - value) < 0.01 ? 'selected' : ''}>${preset.label}</option>`
          ).join('');
          html += `
            <div class="dialog-dynamic-row" data-mul-index="${mulIndex}">
              <input type="number" class="dialog-input dialog-multiplicative-input" id="dialog-multiplicative-${mulIndex}" data-index="${mulIndex}" value="${value || ''}" placeholder="" style="flex: 1;" />
              <select class="dialog-preset-select dialog-multiplicative-preset" id="dialog-multiplicative-preset-${mulIndex}" data-index="${mulIndex}" style="flex-shrink: 0; width: 200px;">
                <option value="custom">自訂</option>${presetOptions}
              </select>
              <button class="dialog-delete-btn" type="button" data-index="${mulIndex}" aria-label="刪除">−</button>
            </div>
          `;
        });
        return html;
      }
      
      // 綁定單行事件
      function bindSingleRowEvents(row, inputSelector, handleChange) {
        const input = row.querySelector(inputSelector);
        const presetSelect = row.querySelector('.dialog-preset-select');
        const deleteBtn = row.querySelector('.dialog-delete-btn');
        
        input.addEventListener('input', handleChange);
        input.addEventListener('change', handleChange);
        presetSelect.addEventListener('change', (e) => {
          if (e.target.value !== 'custom') {
            input.value = e.target.value;
          }
          handleChange();
        });
        deleteBtn.addEventListener('click', (e) => {
          e.preventDefault();
          row.remove();
          handleChange();
        });
      }
      
      // 綁定容器中所有行的事件
      function bindDamageRowEvents(container, inputSelector, handleChange) {
        const rows = container.querySelectorAll('.dialog-dynamic-row');
        rows.forEach(row => {
          if (row.dataset.eventsBound) return;
          bindSingleRowEvents(row, inputSelector, handleChange);
          row.dataset.eventsBound = 'true';
        });
      }
      
      // 生成對話框 HTML 結構
      function generateCriticalDamageDialogHTML(index, currentValues, additivesHTML, multiplicativesHTML) {
        const panelInputId = `dialog-panel-${index}`;
        return `
          <div class="detailed-dialog">

                </div>

              </div>

          </div>
        `;
      }
      
      // 設置對話框位置和初始狀態
      function setupDialogPosition(dialog, button, panelDiv) {
        const inputPanelRect = panelDiv.getBoundingClientRect();
        const calcPanel = document.getElementById('calcPanel');
        const calcPanelRect = calcPanel.getBoundingClientRect();
        
        const topPos = inputPanelRect.top - calcPanelRect.top;
        const leftPos = calcPanel.offsetWidth * 0.62;
        
        dialog.style.top = topPos + 'px';
        dialog.style.left = leftPos + 'px';
        button.classList.add('focus');
        dialog.classList.add('show');
      }
      
      // =============== 致命一擊傷害專用對話框 (支持動態加算/乘算行) ===============
      function openCriticalDamageDialog(button, type, index, panelDiv, config, dialog, spinnerIncrement = 0) {
        // 解析當前值
        const currentValues = config.parse(button.dataset.value || '');
        if (spinnerIncrement !== 0) {
          currentValues.panel = Math.max(0, currentValues.panel + spinnerIncrement);
        }
        
        // 預設乘算爆傷選項
        const multiplicativePresets = [
          { label: 'MAESTRO光環', value: 2 },
          { label: '團隊爆傷', value: 10 },
          { label: '223草套(20/23/26/30)', value: 30 }
        ];
        
        // 生成 HTML
        const additivesHTML = generateAdditivesHTML(currentValues);
        const multiplicativesHTML = generateMultiplicativesHTML(currentValues, multiplicativePresets);
        dialog.innerHTML = generateCriticalDamageDialogHTML(index, currentValues, additivesHTML, multiplicativesHTML);
        
        // 獲取對話框元素
        const panelInput = dialog.querySelector('.dialog-panel-input');
        const additivesContainer = dialog.querySelector('#additive-damages-container');
        const multiplicativesContainer = dialog.querySelector('#multiplicative-damages-container');
        
        // 設置初始值
        panelInput.value = currentValues.panel || '';
        
        // 設置對話框位置
        setupDialogPosition(dialog, button, panelDiv);
        panelInput.focus();
        
        // 實時同步更新的函數
        const handleInputChange = () => {
          const panelValue = parseFloat(panelInput.value) || 0;
          const additiveDamages = Array.from(dialog.querySelectorAll('.dialog-additive-input')).map(input => parseFloat(input.value) || 0);
          const multiplicativeDamages = Array.from(dialog.querySelectorAll('.dialog-multiplicative-input')).map(input => parseFloat(input.value) || 0).filter(val => val !== 0);
          
          const values = {
            panel: Math.max(0, panelValue),
            additive_damages: additiveDamages.length > 0 ? additiveDamages : [0],
            multiplicative_damages: multiplicativeDamages.length > 0 ? multiplicativeDamages : [0]
          };
          
          button.dataset.value = config.serialize(values);
          button.textContent = (config.getDisplayValue(values) === 0 || config.getDisplayValue(values) === '0') ? '' : config.getDisplayValue(values);
          syncStatUpdate(button);
        };
        
        // 綁定 panel 輸入和按鈕事件
        panelInput.addEventListener('input', handleInputChange);
        panelInput.addEventListener('change', handleInputChange);
        dialog.querySelector('.dialog-panel-up').addEventListener('click', (e) => {
          e.preventDefault();
          panelInput.value = Math.max(0, (parseFloat(panelInput.value) || 0) + 1);
          handleInputChange();
        });
        dialog.querySelector('.dialog-panel-down').addEventListener('click', (e) => {
          e.preventDefault();
          panelInput.value = Math.max(0, (parseFloat(panelInput.value) || 0) - 1);
          handleInputChange();
        });
        
        // 綁定行事件
        bindDamageRowEvents(additivesContainer, '.dialog-additive-input', handleInputChange);
        bindDamageRowEvents(multiplicativesContainer, '.dialog-multiplicative-input', handleInputChange);
        
        // 添加行按鈕
        dialog.querySelector('#add-additive-btn').addEventListener('click', (e) => {
          e.preventDefault();
          const newRow = document.createElement('div');
          newRow.className = 'dialog-dynamic-row';
          const addIndex = Date.now();
          newRow.dataset.addIndex = addIndex;
          newRow.innerHTML = `
            <input type="number" class="dialog-input dialog-additive-input" id="dialog-additive-${addIndex}" placeholder="" style="flex: 1;" />
            <select class="dialog-preset-select dialog-additive-preset" id="dialog-additive-preset-${addIndex}" style="flex-shrink: 0; width: 200px;">
              <option value="custom" selected>自訂</option>
            </select>
            <button class="dialog-delete-btn" type="button" aria-label="刪除">−</button>
          `;
          additivesContainer.appendChild(newRow);
          bindSingleRowEvents(newRow, '.dialog-additive-input', handleInputChange);
          newRow.dataset.eventsBound = 'true';
          newRow.querySelector('.dialog-additive-input').focus();
        });
        
        dialog.querySelector('#add-multiplicative-btn').addEventListener('click', (e) => {
          e.preventDefault();
          const newRow = document.createElement('div');
          newRow.className = 'dialog-dynamic-row';
          const mulIndex = Date.now();
          newRow.dataset.mulIndex = mulIndex;
          const presetOptions = multiplicativePresets.map(p => `<option value="${p.value}">${p.label}</option>`).join('');
          newRow.innerHTML = `
            <input type="number" class="dialog-input dialog-multiplicative-input" id="dialog-multiplicative-${mulIndex}" placeholder="" style="flex: 1;" />
            <select class="dialog-preset-select dialog-multiplicative-preset" id="dialog-multiplicative-preset-${mulIndex}" style="flex-shrink: 0; width: 200px;">
              <option value="custom" selected>自訂</option>${presetOptions}
            </select>
            <button class="dialog-delete-btn" type="button" aria-label="刪除">−</button>
          `;
          multiplicativesContainer.appendChild(newRow);
          bindSingleRowEvents(newRow, '.dialog-multiplicative-input', handleInputChange);
          newRow.dataset.eventsBound = 'true';
          newRow.querySelector('.dialog-multiplicative-input').focus();
        });
        
        // 定義焦點處理
        const handleOtherInputFocus = (e) => {
          const isOwnElement = dialog.contains(e.target);
          if ((e.target.classList.contains('stat-input') || e.target.classList.contains('button-input')) && !isOwnElement) {
            closeDialog();
          }
        };
        
        const closeDialog = () => {
          dialog.classList.remove('show');
          button.classList.remove('focus');
          button.blur();
          
          // 最後一次更新計算結果
          if (window.updateProductDisplay && typeof window.updateProductDisplay === 'function') {
            setTimeout(() => {
              window.updateProductDisplay();
            }, 10);
          }
          
          // 移除所有事件監聽器
          document.removeEventListener('click', handleDocumentClick, true);
          document.removeEventListener('focus', handleOtherInputFocus, true);
          document.removeEventListener('keydown', handleKeyDown);
        };
        
        const handleDocumentClick = (e) => {
          if (dialog.contains(e.target)) {
            return;
          }
          closeDialog();
        };
        
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') closeDialog();
        };
        
        // 綁定全局事件監聽器
        document.addEventListener('click', handleDocumentClick, true);
        document.addEventListener('focus', handleOtherInputFocus, true);
        document.addEventListener('keydown', handleKeyDown);
        
        // 立即觸發一次更新
        handleInputChange();
      }

      // =============== 通用特殊對話框打開函數 ===============
      function openSpecialDialog(button, type, index, panelDiv, config, spinnerIncrement = 0) {

                      </svg>
                    </button>
                    <button class="dialog-spinner-btn dialog-spinner-down" type="button" aria-label="減少" title="減少">
                      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">

                    </button>

        dialog.innerHTML = `
          <div class="detailed-dialog">

              ${fieldsHTML}

          </div>

        // 獲取所有字段元素
        const fieldElements = {};

          fieldElements[field.name] = dialog.querySelector(`.${field.className}`);
        });
        
        const calcPanel = document.getElementById('calcPanel');
        
        // 設置對話框位置
        setupDialogPosition(dialog, button, panelDiv);
        
        // 解析並設置初始值
        const parsedValues = config.parse(button.dataset.value || '');
        
        // main panel spinner 增量（打開對話框時的初始值調整）
        if (spinnerIncrement !== 0) {
          if (config.type === 'simple-number') {
            parsedValues.value = Math.max(0, parsedValues.value + spinnerIncrement);
          } else if (config.type === 'multi-field') {
            // ★ 移除最大值限制：輸入階段允許任意值
            parsedValues.panel = Math.max(0, parsedValues.panel + spinnerIncrement);
          }
        }
        
        config.fields.forEach(field => {
          const element = fieldElements[field.name];
          if (element) {
            if (field.type === 'checkbox') {
              element.checked = parsedValues[field.name] === true;
            } else {
              // 对于数字字段，如果值为0或未定义，显示为空
              const fieldValue = parsedValues[field.name];
              if (field.type === 'number' && (fieldValue === 0 || fieldValue === undefined)) {
                element.value = '';
              } else {
                element.value = fieldValue !== undefined ? fieldValue : (field.defaultValue || '');
              }
            }
          }
        });
        
        // 添加 button 的 focus 類
        button.classList.add('focus');
        
        // 顯示對話框
        dialog.classList.add('show');
        fieldElements[config.fields[0].name].focus();
        fieldElements[config.fields[0].name].select?.();
        
        // 實時同步輸入值到 button
        const handleInputChange = () => {
          const values = {};
          config.fields.forEach(field => {
            let value;
            
            // 處理不同類型的字段
            if (field.type === 'checkbox') {
              value = fieldElements[field.name].checked;
            } else {
              value = fieldElements[field.name].value;
            }
            
            // 處理數字類型
            if (field.type === 'number') {
              value = roundNumber(parseFloat(value) || 0);
              // 應用最小值限制
              if (field.minValue !== undefined && value < field.minValue) {
                value = field.minValue;
                fieldElements[field.name].value = value;
              }
              // ★ 最大值限制移除：輸入階段允許任意值（包括 > 60）
              // 計算階段的限制已在 calc.js 的 calculateAdaptabilityValue() 中實現
            }
            
            values[field.name] = value;
          });
          
          // 序列化並保存值
          const serialized = config.serialize(values);
          button.dataset.value = serialized;
          
          // 更新按鈕顯示（只顯示指定字段）
          const displayValue = config.getDisplayValue ? config.getDisplayValue(values) : values[config.displayField];
          // 如果顯示值為0或'0'，保持空白；否則顯示值
          button.textContent = (displayValue === 0 || displayValue === '0') ? '' : displayValue;
          
          // 調用統一接口進行完整更新流程
          syncStatUpdate(button);
          
          // ★ 適應力 preset 同步邏輯 ★
          // 配置1與2的環境Debuff設置要同步
          if (index === 1 && values.preset !== undefined) {
            // 找到適應力的另一個按鈕（left或result）
            const panels = document.querySelectorAll('.input-panel-item');
            for (let panel of panels) {
              if (parseInt(panel.dataset.index) === 1) {
                const otherButtonClass = type === 'left' ? '.result-input' : '.left-input';
                const otherButton = panel.querySelector(otherButtonClass);
                
                if (otherButton && otherButton !== button) {
                  // 解析另一個按鈕的值
                  const otherValue = otherButton.dataset.value || '0|0|0|0|95';
                  const otherParts = otherValue.split('|');
                  
                  // 更新 preset 值（第5個部分，索引4）
                  otherParts[4] = values.preset;
                  const updatedValue = otherParts.join('|');
                  
                  // 保存到另一個按鈕
                  otherButton.dataset.value = updatedValue;
                  
                  // 更新另一個按鈕的顯示（計算顯示值）
                  const otherParsedValues = config.parse(updatedValue);
                  const displayValue = config.getDisplayValue ? config.getDisplayValue(otherParsedValues) : otherParsedValues[config.displayField];
                  otherButton.textContent = (displayValue === 0 || displayValue === '0') ? '' : displayValue;
                  
                  // 觸發另一個按鈕的統一接口更新流程
                  syncStatUpdate(otherButton);
                }
              }
            }
          }
        };
        
        // 立即觸發一次 handleInputChange 來序列化初始值並保存到 button
        handleInputChange();
        
        // 定義焦點處理
        const handleOtherInputFocus = (e) => {
          const isOwnElement = config.fields.some(field => fieldElements[field.name] === e.target);
          // 排除 spinner 按鈕：點擊 spinner 時不關閉對話框
          const isSpinnerButton = e.target.classList.contains('dialog-spinner-btn') || 
                                  e.target.closest('.dialog-spinner-btn') !== null;
          if (!isSpinnerButton && (e.target.classList.contains('stat-input') || e.target.classList.contains('button-input')) && !isOwnElement) {
            closeDialog();
          }
        };
        
        const closeDialog = () => {
          dialog.classList.remove('show');
          button.classList.remove('focus');
          button.blur();
          
          // Dialog 關閉時，同步快取並更新顯示
          if (window.syncAllStatValues && typeof window.syncAllStatValues === 'function') {
            window.allStatValues = window.syncAllStatValues();
            // syncAllStatValues 會自動調用 updateProductDisplay，無需再調用
          } else if (window.updateProductDisplay && typeof window.updateProductDisplay === 'function') {
            // 備用：如果沒有 syncAllStatValues，直接調用 updateProductDisplay
            setTimeout(() => {
              window.updateProductDisplay();
            }, 10);
          }
          
          // 移除所有事件監聽器
          config.fields.forEach(field => {
            const element = fieldElements[field.name];
            if (element) {
              element.removeEventListener('input', handleInputChange);
              element.removeEventListener('change', handleInputChange);
              element.removeEventListener('keydown', handleKeyDown);
            }
          });
          document.removeEventListener('click', handleDocumentClick, true);
          document.removeEventListener('focus', handleOtherInputFocus, true);
        };
        
        const handleDocumentClick = (e) => {
          // 排除對話框內部和 spinner 按鈕的點擊
          if ((dialog.contains(e.target) || (e.target.closest && e.target.closest(`#${config.dialogId}`))) || 
              e.target.classList.contains('dialog-spinner-btn') ||
              (e.target.closest && e.target.closest('.dialog-spinner-btn'))) {
            return;
          }
          closeDialog();
        };
        
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') closeDialog();
          if (e.key === 'Tab') {
            e.preventDefault();
            const focusedIndex = config.fields.findIndex(f => fieldElements[f.name] === document.activeElement);
            const nextIndex = (focusedIndex + 1) % config.fields.length;
            fieldElements[config.fields[nextIndex].name].focus();
          }
        };
        
        // 綁定事件監聽器
        config.fields.forEach(field => {
          const element = fieldElements[field.name];
          if (element) {
            if (field.type === 'number') {
              element.addEventListener('input', handleInputChange);
              element.addEventListener('change', handleInputChange);
              
              // 對話框內 spinner 按鈕事件（實時改值）
              const parentDiv = element.parentElement;
              if (parentDiv) {
                const upBtn = parentDiv.querySelector('.dialog-spinner-up');
                const downBtn = parentDiv.querySelector('.dialog-spinner-down');
                
                if (upBtn) {
                  upBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();  // 防止事件冒泡到關閉對話框的邏輯
                    handleDialogSpinnerChange(element, field, 1, handleInputChange);
                  });
                }
                
                if (downBtn) {
                  downBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();  // 防止事件冒泡到關閉對話框的邏輯
                    handleDialogSpinnerChange(element, field, -1, handleInputChange);
                  });
                }
              }
            } else if (field.type === 'select') {
              element.addEventListener('change', handleInputChange);
            } else if (field.type === 'checkbox') {
              element.addEventListener('change', handleInputChange);
            }
            element.addEventListener('keydown', handleKeyDown);
          }
        });
        
        document.addEventListener('keydown', handleKeyDown);
        document.addEventListener('click', handleDocumentClick, true);
        document.addEventListener('focus', handleOtherInputFocus, true);
      }
      
      function openNumberInputDialog(button, type, index, panelDiv) {
        // 所有 button-input 項目都在 SPECIAL_DIALOGS 中有配置，統一使用 openSpecialDialog
        if (SPECIAL_DIALOGS[index]) {
          openSpecialDialog(button, type, index, panelDiv, SPECIAL_DIALOGS[index]);
        }
      }
      
      // 獲取對話框中輸入值的輔助函數 - 支持自訂值格式
      function getInputValueForDialog(element) {
        let value;
        if (element && element.classList.contains('button-input')) {
          if (element.dataset.value) {
            // 支持自訂分隔格式（如適應力的 "panel|super|preset"），只取第一個值
            if (element.dataset.value.includes('|')) {
              value = parseFloat(element.dataset.value.split('|')[0]) || 0;
            } else {
              value = parseFloat(element.dataset.value) || 0;
            }
          } else {
            value = 0;
          }
        } else {
          value = element && element.value ? parseFloat(element.value) : 0;
        }
        return roundNumber(value);
      }

      // 初始化時設置默認高度
      const calcPanel = document.getElementById('calcPanel');
      let wrapper = calcPanel.querySelector('.input-items-wrapper');
      
      // 如果有被選中的項目，添加 panels
      if (selectedGameStats.some(stat => stat === true)) {
        // 初始化時直接添加 panels，不需要動畫
        statItems.forEach((item, index) => {
          if (selectedGameStats[index]) {
            createInputPanel(item, index, wrapper, false);
          }
        });
        // 初始化後更新乘積顯示
        setTimeout(() => {
          if (window.updateProductDisplay && typeof window.updateProductDisplay === 'function') {
            window.updateProductDisplay();
          }
        }, 300);
      }
      
      // 無論有沒有 panels，都計算高度（設置默認高度）
      setTimeout(updatePanelHeight, 50);
    </script>
    <!-- 簡易數據結構 -->
    <script src="src/data-structure.js"></script>
    <!-- 新架構：状态管理层 -->
    <script src="src/store.js"></script>
    <!-- 新架構：計算引擎層 -->
    <script src="src/compute.js"></script>
    <!-- 原有計算邏輯 -->
    <script src="calc.js"></script>
  </body>
</html>
