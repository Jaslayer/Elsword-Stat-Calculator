<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>裝備配置計算機Ver2.0</title>
    <meta
      name="description"
      content="A basic GitHub Pages site starter."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="page-header">
      <h1 class="page-title">裝備配置計算機<span class="version">Ver2.0</span></h1>
    </header>
    <main class="container" aria-label="Main panel">
      <aside class="sidebar">
        <nav class="stat-list" aria-label="Statistics list">
          <button class="stat-item" data-description="">物/魔攻擊力</button>
          <button class="stat-item" data-description="">(超)適應力</button>
          <button class="stat-item" data-description="">致命一擊傷害</button>
          <button class="stat-item" data-description="">兩極化</button>
          <button class="stat-item" data-description="">Boss 傷害</button>
          <button class="stat-item" data-description="">50%以上/以下</button>
          <button class="stat-item" data-description="">100%以下</button>
          <button class="stat-item" data-description="">流血</button>
          <button class="stat-item" data-description="">強烈/超越技傷</button>
          <button class="stat-item" data-description="">所有技傷</button>
          <button class="stat-item" data-description="">其他</button>
        </nav>
        <div class="calc-panel" id="calcPanel">
        </div>
      </aside>
      <section class="content" aria-label="Content area">
        <div class="description-panel" id="descriptionPanel">
          <p>群母上的风桌選手</p>
        </div>
      </section>
    </main>
    <script>
      // 浮点数精度处理函数 - 避免 5.3 显示成 5.3000000002 或 5.29999999
      const roundNumber = (num, decimals = 5) => {
        if (!Number.isFinite(num)) return num;
        // 用字符串匹配来保留有意义的小数位数
        const multiplier = Math.pow(10, decimals);
        const rounded = Math.round(num * multiplier) / multiplier;
        // 如果结果是整数，返回整数；否则返回精确的浮点数
        return parseFloat(rounded.toFixed(decimals).replace(/\.?0+$/, ''));
      };

      /**
       * 主幹函數：統一管理整個統計項目更新流程
       * 流程: User修改input → 調整3方運算 → 更新button-input → 計算所有統計結果 → 更新產品顯示
       * @param {Element} changedElement - 改變的輸入元素
       * @param {string} changeType - 改變類型: 'left' 或 'result'（用於三向綁定）
       */
      function triggerFullStatUpdate(changedElement, changeType) {
        if (!changedElement) return;

        // 找到所屬的面板
        const panelDiv = changedElement.closest('.input-panel-item');
        if (!panelDiv) {
          return;
        }

        // 第1步: 如果是 button-input，觸發三向綁定調整
        if (changedElement.classList.contains('button-input') && panelDiv.triggerThreeWayBinding) {
          panelDiv.triggerThreeWayBinding(changeType);
        }

        // 第2步: 觸發 button 的 change 事件，讓 button-input 更新
        if (changedElement.classList.contains('button-input')) {
          changedElement.dispatchEvent(new Event('change', { bubbles: true }));
        }

        // 第3步: 更新所有統計結果顯示（會自動調用 calculateAdaptability 等函數）
        if (window.updateProductDisplay && typeof window.updateProductDisplay === 'function') {
          requestAnimationFrame(() => {
            window.updateProductDisplay();
          });
        }
      }


      const statItems = document.querySelectorAll('.stat-item');
      const STORAGE_KEY = 'selectedGameStats';
      
      // 初始化遊戲數值狀態陣列，每個位置對應一個數值是否被選中
      // 優先從 localStorage 讀取，如果沒有則初始化為 false
      let selectedGameStats = localStorage.getItem(STORAGE_KEY)
        ? JSON.parse(localStorage.getItem(STORAGE_KEY))
        : new Array(statItems.length).fill(false);

      const descriptionPanel = document.getElementById('descriptionPanel');
      const descriptionText = descriptionPanel.querySelector('p');


      // 根據保存的狀態恢復按鈕的視覺狀態
      statItems.forEach((item, index) => {
        if (selectedGameStats[index]) {
          item.classList.add('selected');
        }
      });

      statItems.forEach(item => {
        item.addEventListener('mouseenter', (e) => {
          const description = e.target.getAttribute('data-description');
          
          // 如果 data-description 為空，則不開啟懸浮視窗
          if (!description) {
            return;
          }
          
          descriptionText.textContent = description;
          
          const rect = e.target.getBoundingClientRect();
          const containerRect = document.querySelector('.container').getBoundingClientRect();
          const panelLeft = rect.right - containerRect.left + 5;
          const panelTop = rect.top - containerRect.top + rect.height / 2 - descriptionPanel.offsetHeight / 2;
          
          descriptionPanel.style.left = panelLeft + 'px';
          descriptionPanel.style.top = panelTop + 'px';
          descriptionPanel.classList.add('show');
        });

        item.addEventListener('mouseleave', () => {
          descriptionPanel.classList.remove('show');
        });

        item.addEventListener('click', (e) => {
          const itemIndex = Array.from(statItems).indexOf(e.target);
          
          // Toggle selected 狀態
          e.target.classList.toggle('selected');
          
          // 移除焦點，使按鈕立即回復到正常樣式
          e.target.blur();
          
          // 更新遊戲數值選取狀態陣列
          selectedGameStats[itemIndex] = !selectedGameStats[itemIndex];
          
          // 保存到 localStorage
          localStorage.setItem(STORAGE_KEY, JSON.stringify(selectedGameStats));
          
          // 更新輸入面板
          updateInputPanel();
        });
      });

      // 更新輸入面板的函數
      function updateInputPanel() {
        const calcPanel = document.getElementById('calcPanel');
        let wrapper = calcPanel.querySelector('.input-items-wrapper');
        
        // 如果不存在包裝容器，創建它
        if (!wrapper) {
          wrapper = document.createElement('div');
          wrapper.className = 'input-items-wrapper';
          calcPanel.insertBefore(wrapper, calcPanel.firstChild);
          
          // 創建永久停駐的頭部
          const headerPanel = document.createElement('div');
          headerPanel.className = 'input-panel-header';
          headerPanel.innerHTML = `
            <div class="panel-row">
              <div class="panel-label">配置名稱</div>
              <div class="config-wrapper">
                <div style="color: rgba(255, 255, 255, 0.7); text-align: center; width: 100px;">配置 1</div>
                <div style="width: 20px;"></div>
              </div>
              <div class="config-wrapper">
                <div style="color: rgba(255, 255, 255, 0.7); text-align: center; width: 100px;">配置 2</div>
                <div style="width: 20px;"></div>
              </div>
              <div class="config-wrapper">
                <span class="middle-indicator">▲</span>
                <div style="color: rgba(255, 255, 255, 0.7); text-align: center; width: 100px;">變動量</div>
                <div style="width: 20px;"></div>
              </div>
            </div>
          `;
          wrapper.appendChild(headerPanel);
        }
        
        // 獲取應該存在的 stat-item 索引
        const shouldExistIndices = [];
        statItems.forEach((item, index) => {
          if (selectedGameStats[index]) {
            shouldExistIndices.push(index);
          }
        });
        
        // 獲取當前存在的 panel 索引
        const currentPanels = wrapper.querySelectorAll('.input-panel-item');
        const currentIndices = Array.from(currentPanels).map(panel => parseInt(panel.dataset.index));
        
        // 判斷是要添加還是刪除
        const toAdd = shouldExistIndices.filter(index => !currentIndices.includes(index));
        const toRemove = currentIndices.filter(index => !shouldExistIndices.includes(index));
        
        if (toRemove.length > 0) {
          // 刪除模式：先縮小 calc-panel，再刪除 panels
          // 添加 removing 類開始刪除動畫
          toRemove.forEach((index) => {
            const panel = wrapper.querySelector(`[data-index="${index}"]`);
            if (panel) {
              panel.classList.add('removing');
            }
          });
          
          // 計算新的高度（排除要刪除的 panels）並縮小 calc-panel
          updatePanelHeight(toRemove);
          
          // 等待收縮動畫完成後刪除 panels
          setTimeout(() => {
            toRemove.forEach((index) => {
              const panel = wrapper.querySelector(`[data-index="${index}"]`);
              if (panel) {
                panel.remove();
              }
            });
            // 重新排列剩餘的 panels
            reorderPanels(shouldExistIndices, wrapper);
            // 更新乘積顯示
            if (window.updateProductDisplay) {
              window.updateProductDisplay();
            }
          }, 350);
        } else if (toAdd.length > 0) {
          // 添加模式：先添加 panels，展開 calc-panel，再顯示動畫
          // 先添加新的 panels
          toAdd.forEach((index) => {
            const statItem = statItems[index];
            createInputPanel(statItem, index, wrapper, true); // 傳入 true 表示新增
          });
          
          // 重新排列
          reorderPanels(shouldExistIndices, wrapper);
          
          // 先計算新的高度並展開 calc-panel
          setTimeout(() => {
            updatePanelHeight();
            // 更新乘積顯示
            if (window.updateProductDisplay) {
              window.updateProductDisplay();
            }
          }, 50);
        } else {
          // 只有排序變化
          reorderPanels(shouldExistIndices, wrapper);
          // 更新乘積顯示
          if (window.updateProductDisplay) {
            window.updateProductDisplay();
          }
        }
      }
      
      // 重新排列 panels 的函數
      function reorderPanels(shouldExistIndices, wrapper) {
        const headerPanel = wrapper.querySelector('.input-panel-header');
        const allPanels = Array.from(wrapper.querySelectorAll('.input-panel-item'));
        allPanels.forEach((panel) => {
          const panelIndex = parseInt(panel.dataset.index);
          
          // 只排序在 shouldExistIndices 中的 panels
          if (!shouldExistIndices.includes(panelIndex)) {
            return;
          }
          
          const targetPosition = shouldExistIndices.indexOf(panelIndex);
          // targetPosition 是相對於 panels 的位置，但在 wrapper 中要加 1（因為 header 在第 0 位）
          const targetPositionInWrapper = targetPosition + 1;
          const currentPosition = Array.from(wrapper.children).indexOf(panel);
          
          // 如果位置不正確，添加動畫類並移動到正確位置
          if (currentPosition !== targetPositionInWrapper) {
            // 添加重排序動畫類
            panel.classList.add('reordering');
            
            // 計算目標元素（確保 header 始終在最前）
            const targetElement = Array.from(wrapper.children)[targetPositionInWrapper];
            if (targetElement) {
              wrapper.insertBefore(panel, targetElement);
            } else {
              wrapper.appendChild(panel);
            }
            
            // 動畫完成後移除類
            setTimeout(() => {
              panel.classList.remove('reordering');
            }, 350);
          }
        });
      }
      
      // 更新 calc-panel 的高度
      // excludeIndices: 要排除的 panel 索引陣列（用於刪除時計算新高度）
      function updatePanelHeight(excludeIndices = []) {
        const calcPanel = document.getElementById('calcPanel');
        const wrapper = calcPanel.querySelector('.input-items-wrapper');
        
        if (!wrapper) {
          return;
        }
        
        // 使用多次 requestAnimationFrame 確保布局穩定後再計算
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            // 先隱藏要排除的 panels
            excludeIndices.forEach(index => {
              const panel = wrapper.querySelector(`[data-index="${index}"]`);
              if (panel) {
                panel.style.display = 'none';
              }
            });
            
            // 等待隱藏生效後再計算高度
            requestAnimationFrame(() => {
              const visiblePanels = Array.from(wrapper.querySelectorAll('.input-panel-item')).filter(panel => {
                return panel.style.display !== 'none';
              });
              
              const headerHeight = wrapper.querySelector('.input-panel-header')?.scrollHeight || 0;
              
              if (visiblePanels.length === 0) {
                // 沒有 input-panel-item，但仍需要 header 的高度
                const styles = window.getComputedStyle(calcPanel);
                const paddingTop = parseFloat(styles.paddingTop) || 0;
                const paddingBottom = parseFloat(styles.paddingBottom) || 0;
                const totalHeight = headerHeight + paddingTop + paddingBottom;
                calcPanel.style.height = totalHeight + 'px';
              } else {
                // 直接使用 wrapper 的 scrollHeight（包括所有可見內容和 gap）
                const wrapperHeight = wrapper.scrollHeight;
                const styles = window.getComputedStyle(calcPanel);
                const paddingTop = parseFloat(styles.paddingTop) || 0;
                const paddingBottom = parseFloat(styles.paddingBottom) || 0;
                const totalHeight = wrapperHeight + paddingTop + paddingBottom;
                
                calcPanel.style.height = totalHeight + 'px';
              }
              
              // 還原隱藏
              excludeIndices.forEach(index => {
                const panel = wrapper.querySelector(`[data-index="${index}"]`);
                if (panel) {
                  panel.style.display = '';
                }
              });
            });
          });
        });
      }

      // 為每個被選中的 stat-item 創建一個 input-panel
      function createInputPanel(statItem, index, container, isNewItem = false) {
        const panelDiv = document.createElement('div');
        panelDiv.className = 'input-panel-item';
        if (isNewItem) {
          panelDiv.classList.add('entering');
        }
        panelDiv.dataset.index = index;
        
        // 判斷是否需要按鈕型輸入框的 stat-item
        const buttonInputIndices = [0, 1, 2, 4, 5, 10];
        const useButtonInput = buttonInputIndices.includes(index);
        
        if (useButtonInput) {
          // 按鈕型輸入框
          panelDiv.innerHTML = `
            <button class="delete-panel-btn-inline" data-index="${index}">×</button>
            <div class="panel-row">
              <div class="panel-label">${statItem.textContent}</div>
              <div class="config-wrapper">
                <button class="button-input left-input" data-index="${index}" data-type="left" data-value="0" data-min="0"></button>
                <div class="input-spinner">
                  <button class="spinner-btn up" data-type="left" data-index="${index}">∧</button>
                  <button class="spinner-btn down" data-type="left" data-index="${index}">∨</button>
                </div>
              </div>
              <div class="config-wrapper">
                <button class="button-input result-input" data-index="${index}" data-type="result" data-value="0" data-min="0"></button>
                <div class="input-spinner">
                  <button class="spinner-btn up" data-type="result" data-index="${index}">∧</button>
                  <button class="spinner-btn down" data-type="result" data-index="${index}">∨</button>
                </div>
              </div>
              <div class="config-wrapper">
                <span class="middle-indicator">▲</span>
                <input type="number" class="stat-input short-input middle-input" placeholder="變動量" data-index="${index}" />
                <div class="input-spinner">
                  <button class="spinner-btn up" data-type="middle" data-index="${index}">∧</button>
                  <button class="spinner-btn down" data-type="middle" data-index="${index}">∨</button>
                </div>
              </div>
            </div>
          `;
        } else {
          // 常規輸入框
          panelDiv.innerHTML = `
            <button class="delete-panel-btn-inline" data-index="${index}">×</button>
            <div class="panel-row">
              <div class="panel-label">${statItem.textContent}</div>
              <div class="config-wrapper">
                <input type="number" class="stat-input short-input left-input" data-index="${index}" min="0" />
                <div class="input-spinner">
                  <button class="spinner-btn up" data-type="left" data-index="${index}">∧</button>
                  <button class="spinner-btn down" data-type="left" data-index="${index}">∨</button>
                </div>
              </div>
              <div class="config-wrapper">
                <input type="number" class="stat-input short-input result-input" data-index="${index}" min="0" />
                <div class="input-spinner">
                  <button class="spinner-btn up" data-type="result" data-index="${index}">∧</button>
                  <button class="spinner-btn down" data-type="result" data-index="${index}">∨</button>
                </div>
              </div>
              <div class="config-wrapper">
                <span class="middle-indicator">▲</span>
                <input type="number" class="stat-input short-input middle-input" placeholder="+/-" data-index="${index}" />
                <div class="input-spinner">
                  <button class="spinner-btn up" data-type="middle" data-index="${index}">∧</button>
                  <button class="spinner-btn down" data-type="middle" data-index="${index}">∨</button>
                </div>
              </div>
            </div>
          `;
        }
        
        // 确保删除按钮元素存在
        const deleteBtn = panelDiv.querySelector('.delete-panel-btn-inline');
        
        // 绑定 panel 的 hover 事件，显示隐藏删除按钮
        panelDiv.addEventListener('mouseenter', () => {
          deleteBtn.classList.add('show');
        });
        
        panelDiv.addEventListener('mouseleave', () => {
          deleteBtn.classList.remove('show');
        });
        
        // 绑定删除按钮的点击事件
        deleteBtn.addEventListener('click', () => {
          statItems[index].classList.remove('selected');
          selectedGameStats[index] = false;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(selectedGameStats));
          updateInputPanel();
        });
        
        container.appendChild(panelDiv);
        
        // 動畫完成後移除 entering 類
        if (isNewItem) {
          setTimeout(() => {
            panelDiv.classList.remove('entering');
          }, 400);
        }
        
        // 綁定計算事件 - 三向绑定逻辑
        const leftInput = panelDiv.querySelector('.left-input');
        const middleInput = panelDiv.querySelector('.middle-input');
        const resultInput = panelDiv.querySelector('.result-input');
        const middleIndicator = panelDiv.querySelector('.middle-indicator');
        
        // 獲取輸入值的輔助函數 - 支持適應力的 "panel|super|preset" 格式
        const getInputValue = (element) => {
          let value;
          if (element.classList.contains('button-input')) {
            if (element.dataset.value) {
              // 檢查是否是適應力項目
              const panelItem = element.closest('.input-panel-item');
              if (panelItem && parseInt(panelItem.dataset.index) === 1) {
                // 適應力特殊處理：返回計算後的完整值
                const parts = element.dataset.value.split('|');
                const panelValue = parseFloat(parts[0]) || 0;
                const gatheringPlace = parts[1] === '1' ? 2 : 0;
                const adaptPotion = parts[2] === '1' ? 3 : 0;
                const superAdapt = parseFloat(parts[3]) || 0;
                
                const buffedPanel = Math.min(panelValue + gatheringPlace + adaptPotion, 60);
                value = buffedPanel + superAdapt;
              } else if (element.dataset.value.includes('|')) {
                // 其他 pipe-separated 格式只取第一個值
                value = parseFloat(element.dataset.value.split('|')[0]) || 0;
              } else {
                value = parseFloat(element.dataset.value) || 0;
              }
            } else {
              value = 0;
            }
          } else {
            value = element.value ? parseFloat(element.value) : 0;
          }
          return roundNumber(value);
        };
        
        // 設置輸入值的輔助函數 - 支持適應力的 "panel|super|preset" 格式
        const setInputValue = (element, value) => {
          const precisedValue = roundNumber(value);
          if (element.classList.contains('button-input')) {
            // 對於適應力按鈕（含有 | 符號），保留 super 值和 preset 值，更新 panel 值
            if (element.dataset.value && element.dataset.value.includes('|')) {
              const parts = element.dataset.value.split('|');
              if (parts.length >= 3) {
                element.dataset.value = `${precisedValue}|${parts[1]}|${parts[2]}`;
              } else if (parts.length === 2) {
                element.dataset.value = `${precisedValue}|${parts[1]}`;
              } else {
                element.dataset.value = precisedValue;
              }
            } else {
              element.dataset.value = precisedValue;
            }
            element.textContent = precisedValue;
          } else {
            element.value = precisedValue;
          }
        };
        
        // 更新中間指示器
        const updateMiddleIndicator = () => {
          const middleValue = roundNumber(parseFloat(middleInput.value) || 0);
          middleIndicator.classList.remove('positive', 'negative', 'zero');
          middleIndicator.textContent = '▲';
          if (middleValue > 0) {
            middleIndicator.classList.add('positive');
          } else if (middleValue < 0) {
            middleIndicator.classList.add('negative');
          } else {
            middleIndicator.classList.add('zero');
          }
        };
        
        // 觸發三向綁定更新的函數
        const triggerThreeWayBinding = (changedType) => {
          const leftValue = getInputValue(leftInput);
          const resultValue = getInputValue(resultInput);
          const middleValue = parseFloat(middleInput.value) || 0;
          
          if (changedType === 'left') {
            // 配置1改變 → 變動量 = 配置2 - 配置1
            // 限制配置1最小值為 0
            const constrainedLeftValue = Math.max(0, leftValue);
            const newMiddle = roundNumber(resultValue - constrainedLeftValue);
            if (constrainedLeftValue !== leftValue) {
              setInputValue(leftInput, constrainedLeftValue);
            }
            middleInput.value = newMiddle;
          } else if (changedType === 'result') {
            // 配置2改變 → 變動量 = 配置2 - 配置1
            // 限制配置2最小值為 0
            const constrainedResultValue = Math.max(0, resultValue);
            const newMiddle = roundNumber(constrainedResultValue - leftValue);
            if (constrainedResultValue !== resultValue) {
              setInputValue(resultInput, constrainedResultValue);
            }
            middleInput.value = newMiddle;
          } else if (changedType === 'middle') {
            // 變動量改變 → 配置2 = 配置1 + 變動量
            const newResult = roundNumber(leftValue + middleValue);
            // 限制配置2最小值為 0
            const constrainedResult = Math.max(0, newResult);
            setInputValue(resultInput, constrainedResult);
          }
          updateMiddleIndicator();
          // 更新乘積顯示
          if (window.updateProductDisplay) {
            window.updateProductDisplay();
          }
        };
        
        // 上下按钮的处理函数
        const handleSpinnerChange = (inputElement, increment) => {
          // 支持按鈕型輸入框
          if (inputElement.classList.contains('button-input')) {
            // 檢查是否有特殊對話框配置（如適應力）
            const itemIndex = parseInt(panelDiv.dataset.index);
            if (SPECIAL_DIALOGS[itemIndex]) {
              // 如果有特殊對話框，直接打開對話框
              const type = inputElement.classList.contains('left-input') ? 'left' : 'result';
              openSpecialDialog(inputElement, type, itemIndex, panelDiv, SPECIAL_DIALOGS[itemIndex]);
              return;
            }
            
            // 沒有特殊對話框時，直接修改值
            const currentValue = getInputValue(inputElement);
            let newValue = roundNumber(currentValue + increment);
            
            // 檢查是否為 left-input 或 result-input，如果是則限制最小值為 0
            if ((inputElement.classList.contains('left-input') || inputElement.classList.contains('result-input')) && newValue < 0) {
              newValue = 0;
            }
            
            // 使用 setInputValue 以正確處理適應力的 "panel|super" 格式
            setInputValue(inputElement, newValue);
            
            // 觸發三向綁定更新
            if (panelDiv.triggerThreeWayBinding) {
              const type = inputElement.classList.contains('left-input') ? 'left' : 'result';
              panelDiv.triggerThreeWayBinding(type);
            }
            return;
          }
          
          // 常規輸入框邏輯
          const currentValue = inputElement.value;
          let newValue;
          
          if (currentValue === '' || currentValue === null) {
            newValue = increment;
          } else {
            const num = parseFloat(currentValue);
            // 保留小数点精度并进行精度处理
            newValue = roundNumber(num + increment);
          }
          
          // 檢查是否為 left-input 或 result-input，如果是則限制最小值為 0
          if ((inputElement.classList.contains('left-input') || inputElement.classList.contains('result-input')) && newValue < 0) {
            newValue = 0;
          }
          
          inputElement.value = newValue;
          // 触发 input 事件以更新关联的计算
          inputElement.dispatchEvent(new Event('input', { bubbles: true }));
        };
        
        // 為按鈕型輸入框添加事件處理
        if (useButtonInput) {
          const leftBtn = panelDiv.querySelector('.left-input');
          const resultBtn = panelDiv.querySelector('.result-input');
          
          // 將三向綁定函數存儲在 panelDiv 上，供對話框使用
          panelDiv.triggerThreeWayBinding = triggerThreeWayBinding;
          panelDiv.getInputValue = getInputValue;
          panelDiv.setInputValue = setInputValue;
          panelDiv.leftInput = leftInput;
          panelDiv.resultInput = resultInput;
          panelDiv.middleInput = middleInput;
          
          leftBtn.addEventListener('click', () => {
            openNumberInputDialog(leftBtn, 'left', index, panelDiv);
          });
          
          resultBtn.addEventListener('click', () => {
            openNumberInputDialog(resultBtn, 'result', index, panelDiv);
          });
        }
        
        // 配置1 改變 → 變動量 = 配置2 - 配置1
        if (leftInput.classList.contains('button-input')) {
          // 按鈕型輸入框不需要綁定 input 事件
        } else {
          leftInput.addEventListener('input', () => {
            triggerThreeWayBinding('left');
            triggerFullStatUpdate(leftInput, 'left');
          });
        }
        
        // 配置2 改變 → 變動量 = 配置2 - 配置1
        if (resultInput.classList.contains('button-input')) {
          // 按鈕型輸入框不需要綁定 input 事件
        } else {
          resultInput.addEventListener('input', () => {
            triggerThreeWayBinding('result');
            triggerFullStatUpdate(resultInput, 'result');
          });
        }
        
        // 變動量 改變 → 配置2 = 配置1 + 變動量
        middleInput.addEventListener('input', () => {
          triggerThreeWayBinding('middle');
          triggerFullStatUpdate(leftInput, 'middle');
        });

        // 绑定所有 spinner 按钮
        const spinnerBtns = panelDiv.querySelectorAll('.spinner-btn');
        spinnerBtns.forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            const dataType = btn.getAttribute('data-type');
            const isUp = btn.classList.contains('up');
            const increment = isUp ? 1 : -1;
            
            let inputElement;
            if (dataType === 'left') {
              inputElement = leftInput;
            } else if (dataType === 'middle') {
              inputElement = middleInput;
            } else if (dataType === 'result') {
              inputElement = resultInput;
            }
            
            if (inputElement) {
              handleSpinnerChange(inputElement, increment);
            }
          });
        });
        
        // 初始化指示器
        updateMiddleIndicator();
      }
      
      // 打開數字輸入對話框 - 檢測適應力並使用雙輸入框
// =============== 特殊對話框配置 (可擴展框架) ===============
      const SPECIAL_DIALOGS = {
        1: { // 適應力 (Adaptability)
          type: 'multi-field',
          dialogId: 'adaptabilityInputDialog',
          fields: [
            {
              name: 'panel',
              type: 'number',
              label: '面板',
              placeholder: '輸入面板值',
              className: 'adaptability-panel-input',
              minValue: 0
            },
            {
              name: 'gathering_place',
              type: 'checkbox',
              label: '集合地 Buff (2%)',
              className: 'adaptability-gathering-place',
              defaultValue: false
            },
            {
              name: 'adapt_potion',
              type: 'checkbox',
              label: '適應靈藥(3%)',
              className: 'adaptability-potion',
              defaultValue: false
            },
            {
              name: 'super_adapt',
              type: 'number',
              label: '超適應力',
              placeholder: '輸入超適應力值',
              className: 'adaptability-super-input',
              minValue: 0
            },
            {
              name: 'preset',
              type: 'select',
              label: '環境 Debuff',
              className: 'adaptability-select',
              options: [
                { value: '0', label: '0%' },
                { value: '50', label: '50% (12CG)' },
                { value: '90', label: '90% (18CG)' },
                { value: '95', label: '95% (20、21、高熵)' }
              ],
              defaultValue: '95'
            }
          ],
          separator: '|',
          displayField: 'panel', // 顯示在按鈕上的字段
          parse: (value) => {
            const parts = value ? value.split('|') : [];
            return {
              panel: parseFloat(parts[0]) || 0,
              gathering_place: parts[1] === 'true' || parts[1] === '1',
              adapt_potion: parts[2] === 'true' || parts[2] === '1',
              super_adapt: parseFloat(parts[3]) || 0,
              preset: parts[4] || '95'
            };
          },
          serialize: (values) => `${values.panel}|${values.gathering_place ? '1' : '0'}|${values.adapt_potion ? '1' : '0'}|${values.super_adapt}|${values.preset}`,
          getDisplayValue: (values) => {
            // 調用 calc.js 中的計算函數
            return calculateAdaptabilityValue(values).toString();
          }
        }
        // 其他特殊項目配置可以在這裡添加
        // 2: { ... },
        // 3: { ... }
      };

      // =============== 通用特殊對話框打開函數 ===============
      function openSpecialDialog(button, type, index, panelDiv, config) {
        // 創建或獲取對話框
        let dialog = document.getElementById(config.dialogId);
        if (!dialog) {
          dialog = document.createElement('div');
          dialog.id = config.dialogId;
          dialog.className = 'number-input-dialog';
          
          // 動態生成對話框內容
          let fieldsHTML = '';
          config.fields.forEach(field => {
            if (field.type === 'number') {
              fieldsHTML += `
                <div class="dialog-input-group">
                  <label class="dialog-input-label">${field.label}</label>
                  <div class="dialog-spinner-wrapper">
                    <input type="number" class="dialog-input ${field.className}" placeholder="${field.placeholder}" />
                    <div class="dialog-spinner-buttons">
                      <button class="dialog-spinner-btn dialog-spinner-up" type="button" aria-label="增加">▲</button>
                      <button class="dialog-spinner-btn dialog-spinner-down" type="button" aria-label="減少">▼</button>
                    </div>
                  </div>
                </div>
              `;
            } else if (field.type === 'select') {
              let optionsHTML = '';
              field.options.forEach(option => {
                optionsHTML += `<option value="${option.value}">${option.label}</option>`;
              });
              fieldsHTML += `
                <div class="dialog-input-group">
                  <label class="dialog-input-label">${field.label}</label>
                  <select class="dialog-select ${field.className}">
                    ${optionsHTML}
                  </select>
                </div>
              `;
            } else if (field.type === 'checkbox') {
              fieldsHTML += `
                <div class="dialog-input-group checkbox-group">
                  <label class="checkbox-label">
                    <input type="checkbox" class="dialog-checkbox ${field.className}" />
                    <span>${field.label}</span>
                  </label>
                </div>
              `;
            }
          });
          
          dialog.innerHTML = `
            <div class="detailed-dialog">
              <div class="dual-input-container">
                ${fieldsHTML}
              </div>
            </div>
          `;
          document.getElementById('calcPanel').appendChild(dialog);
        }
        
        // 獲取所有字段元素
        const fieldElements = {};
        config.fields.forEach(field => {
          fieldElements[field.name] = dialog.querySelector(`.${field.className}`);
        });
        
        const calcPanel = document.getElementById('calcPanel');
        
        // 計算對話框位置
        const inputPanel = panelDiv;
        const inputPanelRect = inputPanel.getBoundingClientRect();
        const calcPanelRect = calcPanel.getBoundingClientRect();
        
        const topPos = inputPanelRect.top - calcPanelRect.top;
        const leftPos = calcPanel.offsetWidth * 0.62;
        
        dialog.style.top = topPos + 'px';
        dialog.style.left = leftPos + 'px';
        
        // 解析並設置初始值
        const parsedValues = config.parse(button.dataset.value || '');
        config.fields.forEach(field => {
          const element = fieldElements[field.name];
          if (element) {
            if (field.type === 'checkbox') {
              element.checked = parsedValues[field.name] === true;
            } else {
              // 对于数字字段，如果值为0或未定义，显示为空
              const fieldValue = parsedValues[field.name];
              if (field.type === 'number' && (fieldValue === 0 || fieldValue === undefined)) {
                element.value = '';
              } else {
                element.value = fieldValue !== undefined ? fieldValue : (field.defaultValue || '');
              }
            }
          }
        });
        
        // 添加 button 的 focus 類
        button.classList.add('focus');
        
        // 顯示對話框
        dialog.classList.add('show');
        fieldElements[config.fields[0].name].focus();
        fieldElements[config.fields[0].name].select?.();
        
        // 實時同步輸入值到 button
        const handleInputChange = () => {
          const values = {};
          config.fields.forEach(field => {
            let value;
            
            // 處理不同類型的字段
            if (field.type === 'checkbox') {
              value = fieldElements[field.name].checked;
            } else {
              value = fieldElements[field.name].value;
            }
            
            // 處理數字類型
            if (field.type === 'number') {
              value = roundNumber(parseFloat(value) || 0);
              // 應用最小值限制
              if (field.minValue !== undefined && value < field.minValue) {
                value = field.minValue;
                fieldElements[field.name].value = value;
              }
            }
            
            values[field.name] = value;
          });
          
          // 序列化並保存值
          const serialized = config.serialize(values);
          button.dataset.value = serialized;
          
          // 更新按鈕顯示（只顯示指定字段）
          button.textContent = config.getDisplayValue ? config.getDisplayValue(values) : values[config.displayField];
          
          // 調用主幹函數進行完整更新流程
          const changeType = type === 'left' ? 'left' : 'result';
          triggerFullStatUpdate(button, changeType);
        };
        
        // 定義焦點處理
        const handleOtherInputFocus = (e) => {
          const isOwnElement = config.fields.some(field => fieldElements[field.name] === e.target);
          if ((e.target.classList.contains('stat-input') || e.target.classList.contains('button-input')) && !isOwnElement) {
            closeDialog();
          }
        };
        
        const closeDialog = () => {
          dialog.classList.remove('show');
          button.classList.remove('focus');
          button.blur();
          
          // 最後一次更新計算結果（確保對話框關閉前已更新）
          if (window.updateProductDisplay && typeof window.updateProductDisplay === 'function') {
            setTimeout(() => {
              window.updateProductDisplay();
            }, 10);
          }
          
          // 移除所有事件監聽器
          config.fields.forEach(field => {
            const element = fieldElements[field.name];
            if (element) {
              element.removeEventListener('input', handleInputChange);
              element.removeEventListener('change', handleInputChange);
              element.removeEventListener('keydown', handleKeyDown);
            }
          });
          document.removeEventListener('click', handleDocumentClick, true);
          document.removeEventListener('focus', handleOtherInputFocus, true);
        };
        
        const handleDocumentClick = (e) => {
          if (dialog.contains(e.target) || (e.target.closest && e.target.closest(`#${config.dialogId}`))) {
            return;
          }
          closeDialog();
        };
        
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') closeDialog();
          if (e.key === 'Tab') {
            e.preventDefault();
            const focusedIndex = config.fields.findIndex(f => fieldElements[f.name] === document.activeElement);
            const nextIndex = (focusedIndex + 1) % config.fields.length;
            fieldElements[config.fields[nextIndex].name].focus();
          }
        };
        
        // 綁定事件監聽器
        config.fields.forEach(field => {
          const element = fieldElements[field.name];
          if (element) {
            if (field.type === 'number') {
              element.addEventListener('input', handleInputChange);
              element.addEventListener('change', handleInputChange);
              
              // 為數字輸入框添加 spinner 按鈕事件
              const spinnerWrapper = element.closest('.dialog-spinner-wrapper');
              if (spinnerWrapper) {
                const upBtn = spinnerWrapper.querySelector('.dialog-spinner-up');
                const downBtn = spinnerWrapper.querySelector('.dialog-spinner-down');
                
                if (upBtn) {
                  upBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const currentValue = parseFloat(element.value) || 0;
                    const minValue = field.minValue !== undefined ? field.minValue : Number.NEGATIVE_INFINITY;
                    element.value = Math.max(minValue, currentValue + 1);
                    element.dispatchEvent(new Event('change', { bubbles: true }));
                  });
                }
                
                if (downBtn) {
                  downBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const currentValue = parseFloat(element.value) || 0;
                    const minValue = field.minValue !== undefined ? field.minValue : Number.NEGATIVE_INFINITY;
                    element.value = Math.max(minValue, currentValue - 1);
                    element.dispatchEvent(new Event('change', { bubbles: true }));
                  });
                }
              }
            } else if (field.type === 'select') {
              element.addEventListener('change', handleInputChange);
            } else if (field.type === 'checkbox') {
              element.addEventListener('change', handleInputChange);
            }
            element.addEventListener('keydown', handleKeyDown);
          }
        });
        
        document.addEventListener('keydown', handleKeyDown);
        document.addEventListener('click', handleDocumentClick, true);
        document.addEventListener('focus', handleOtherInputFocus, true);
      }
      
      function openNumberInputDialog(button, type, index, panelDiv) {
        // 檢查是否有特殊對話框配置
        if (SPECIAL_DIALOGS[index]) {
          openSpecialDialog(button, type, index, panelDiv, SPECIAL_DIALOGS[index]);
          return;
        }
        
        // 創建對話框
        let dialog = document.getElementById('numberInputDialog');
        if (!dialog) {
          dialog = document.createElement('div');
          dialog.id = 'numberInputDialog';
          dialog.className = 'number-input-dialog';
          dialog.innerHTML = `
            <div class="detailed-dialog">
              <input type="number" class="dialog-input" placeholder="輸入數字" />
            </div>
          `;
          document.getElementById('calcPanel').appendChild(dialog);
        }
        
        const input = dialog.querySelector('.dialog-input');
        const calcPanel = document.getElementById('calcPanel');
        
        // 計算對話框位置
        // 獲取按鈕所在的輸入面板
        const inputPanel = panelDiv;
        const inputPanelRect = inputPanel.getBoundingClientRect();
        const calcPanelRect = calcPanel.getBoundingClientRect();
        
        // 計算相對於 calc-panel 的位置
        const topPos = inputPanelRect.top - calcPanelRect.top;
        // left 62%
        const leftPos = calcPanel.offsetWidth * 0.62;
        
        // 設置對話框位置
        dialog.style.top = topPos + 'px';
        dialog.style.left = leftPos + 'px';
        
        // 設置初始值
        input.value = '';
        
        // 添加 button 的 focus 類以保持視覺焦點狀態
        button.classList.add('focus');
        
        // 顯示對話框
        dialog.classList.add('show');
        input.focus();
        input.select();
        
        // 實時同步輸入值到 button
        const handleInputChange = () => {
          let value = roundNumber(parseFloat(input.value) || 0);
          
          // 限制 left-input 和 result-input 的最小值為 0
          if ((button.classList.contains('left-input') || button.classList.contains('result-input')) && value < 0) {
            value = 0;
            input.value = 0;
          }
          
          button.dataset.value = value;
          button.textContent = value;
          
          // 觸發三向綁定更新
          if (panelDiv.triggerThreeWayBinding) {
            const changeType = type === 'left' ? 'left' : 'result';
            panelDiv.triggerThreeWayBinding(changeType);
          }
          
          // 調用主幹函數進行完整更新流程
          const changeType = type === 'left' ? 'left' : 'result';
          triggerFullStatUpdate(button, changeType);
        };
        
        // 定义 handleOtherInputFocus - 在 closeDialog 定义之前
        const handleOtherInputFocus = (e) => {
          // 檢查是否是其他的 input/button 被 focus
          if ((e.target.classList.contains('stat-input') || e.target.classList.contains('button-input')) && e.target !== input) {
            closeDialog();
          }
        };
        
        const closeDialog = () => {
          dialog.classList.remove('show');
          // 移除 button 的 focus 类
          button.classList.remove('focus');
          // 使 button 失焦
          button.blur();
          // 移除所有事件监听器
          input.removeEventListener('input', handleInputChange);
          document.removeEventListener('keydown', handleKeyDown);
          document.removeEventListener('click', handleDocumentClick, true);
          document.removeEventListener('focus', handleOtherInputFocus, true);
        };
        
        // 點擊文檔外部時關閉對話框
        const handleDocumentClick = (e) => {
          // 檢查點擊是否在 dialog 或其容器內
          if (dialog.contains(e.target) || (e.target.closest && e.target.closest('#numberInputDialog'))) {
            return;
          }
          closeDialog();
        };
        
        // 鍵盤事件
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') closeDialog();
        };
        
        input.addEventListener('input', handleInputChange);
        document.addEventListener('keydown', handleKeyDown);
        
        // 直接添加文檔點擊事件，無需延遲
        document.addEventListener('click', handleDocumentClick, true);
        
        // 當其他 inputbox/inputbutton 被 focus 時關閉對話框
        document.addEventListener('focus', handleOtherInputFocus, true);
      }
      
      // 獲取對話框中輸入值的輔助函數 - 支持自訂值格式
      function getInputValueForDialog(element) {
        let value;
        if (element && element.classList.contains('button-input')) {
          if (element.dataset.value) {
            // 支持自訂分隔格式（如適應力的 "panel|super|preset"），只取第一個值
            if (element.dataset.value.includes('|')) {
              value = parseFloat(element.dataset.value.split('|')[0]) || 0;
            } else {
              value = parseFloat(element.dataset.value) || 0;
            }
          } else {
            value = 0;
          }
        } else {
          value = element && element.value ? parseFloat(element.value) : 0;
        }
        return roundNumber(value);
      }

      // 初始化時創建 wrapper 並設置默認高度
      const calcPanel = document.getElementById('calcPanel');
      let wrapper = calcPanel.querySelector('.input-items-wrapper');
      
      if (!wrapper) {
        wrapper = document.createElement('div');
        wrapper.className = 'input-items-wrapper';
        calcPanel.insertBefore(wrapper, calcPanel.firstChild);
        
        // 創建永久停駐的頭部
        const headerPanel = document.createElement('div');
        headerPanel.className = 'input-panel-header';
        headerPanel.innerHTML = `
          <div class="panel-row">
            <div class="panel-label"></div>
            <div class="config-wrapper">
              <div style="color: rgba(255, 255, 255, 0.7); text-align: center; width: 100px;">配置 1</div>
              <div style="width: 20px;"></div>
            </div>
            <div class="config-wrapper">
              <div style="color: rgba(255, 255, 255, 0.7); text-align: center; width: 100px;">配置 2</div>
              <div style="width: 20px;"></div>
            </div>
            <div class="config-wrapper">
              <span class="middle-indicator">▲</span>
              <div style="color: rgba(255, 255, 255, 0.7); text-align: center; width: 100px;">變動量</div>
              <div style="width: 20px;"></div>
            </div>
          </div>
        `;
        wrapper.appendChild(headerPanel);
      }
      
      // 如果有被選中的項目，添加 panels
      if (selectedGameStats.some(stat => stat === true)) {
        // 初始化時直接添加 panels，不需要動畫
        statItems.forEach((item, index) => {
          if (selectedGameStats[index]) {
            createInputPanel(item, index, wrapper, false);
          }
        });
        // 初始化後更新乘積顯示
        setTimeout(() => {
          if (window.updateProductDisplay && typeof window.updateProductDisplay === 'function') {
            window.updateProductDisplay();
          }
        }, 300);
      }
      
      // 無論有沒有 panels，都計算高度（設置默認高度）
      setTimeout(updatePanelHeight, 50);
    </script>
    <script src="calc.js"></script>
  </body>
